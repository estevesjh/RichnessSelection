[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "richness_selection"
version = "0.1.0"
description = "Fast Python engine for Costanzi 2026 projection-effects bias and Sigma_prj in DES cluster cosmology"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Johnny Esteves"}]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "astropy>=5.0",
    "camb>=1.5",
    "mcfit>=0.0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark"]
fast-sigma = ["mcfit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
